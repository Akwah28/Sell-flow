<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B2FD4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="256" fill="#090D16" />

  <!-- Outer gradient ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring-grad)" stroke-width="14" />

  <!-- Inner subtle border ring -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#1E293B" stroke-width="6" />

  <!-- Inner dark base circle -->
  <circle cx="256" cy="256" r="203" fill="#0B1120" />

  <!-- Main speech bubble pointing to bottom-left -->
  <path d="M 256,116 C 176,116 124,162 124,232 C 124,260 133,286 149,307 L 132,374 L 202,358 C 218,366 236,370 256,370 C 336,370 388,324 388,254 C 388,184 336,116 256,116 Z" fill="url(#bg-grad)" />

  <!-- Shopping Bag inside speech bubble -->
  <!-- Handle -->
  <path d="M 224,212 C 224,182 288,182 288,212" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

  <!-- Bag Body -->
  <rect x="198" y="212" width="116" height="100" rx="18" fill="#FFFFFF" />

  <!-- 3 Dots inside Bag -->
  <circle cx="232" cy="262" r="9" fill="#10B981" />
  <circle cx="256" cy="262" r="9" fill="#5B2FD4" />
  <circle cx="280" cy="262" r="9" fill="#10B981" />
</svg>
