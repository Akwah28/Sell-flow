<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B2FD4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium dark slate base circle with shadow/glow -->
  <circle cx="256" cy="256" r="240" fill="#0F172A" stroke="url(#bg-grad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="12" />

  <!-- Inner WhatsApp speech bubble path merged with handle -->
  <path d="M 256,110 C 180,110 130,155 130,225 C 130,252 138,278 153,298 L 138,365 L 208,350 C 223,358 239,362 256,362 C 332,362 382,317 382,247 C 382,177 332,110 256,110 Z" fill="url(#bg-grad)" />

  <!-- Premium Shopping Bag Shape inside the bubble -->
  <!-- Bag Body -->
  <rect x="200" y="210" width="112" height="96" rx="16" fill="#FFFFFF" />
  
  <!-- Bag Handle -->
  <path d="M 226,210 C 226,185 286,185 286,210" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />

  <!-- Chat Dot details inside shopping bag to symbolize messenger flow -->
  <circle cx="236" cy="258" r="8" fill="#10B981" />
  <circle cx="256" cy="258" r="8" fill="#5B2FD4" />
  <circle cx="276" cy="258" r="8" fill="#10B981" />
</svg>
